name: Nixring
options:
  bundleIdPrefix: com.levinschwab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: R95M36AU2X
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

# Two packages, not one: the ads package pulls the consent package in itself,
# but `import UserMessagingPlatform` needs the product as a target dependency.
# Both belong to the app target only. Nothing advertising goes into the Call
# Directory or the Message Filter extension.
packages:
  NixringCore:
    path: Packages/NixringCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.0.0"
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "3.0.0"

targets:
  Nixring:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/blocklist.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Nixring
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.nixring
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Nixring.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Nixring App Store"
    dependencies:
      - package: NixringCore
      - target: NixringCallDirectory
      - target: NixringMessageFilter
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform

  NixringCallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - CallDirectory
      - path: Resources/blocklist.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: NixringCallDirectory
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.nixring.calldir
        INFOPLIST_FILE: CallDirectory/Info.plist
        CODE_SIGN_ENTITLEMENTS: CallDirectory/CallDirectory.entitlements
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Nixring CallDir App Store"
    dependencies:
      - package: NixringCore

  NixringMessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilter
    settings:
      base:
        PRODUCT_NAME: NixringMessageFilter
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.levinschwab.nixring.smsfilter
        INFOPLIST_FILE: MessageFilter/Info.plist
        CODE_SIGN_ENTITLEMENTS: MessageFilter/MessageFilter.entitlements
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Nixring SMSFilter App Store"
    dependencies:
      - package: NixringCore
